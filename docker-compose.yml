services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradegen_dev
      POSTGRES_USER: tradegen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegen -d tradegen_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    profiles: ["tls"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://tradegen:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/tradegen_dev
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${DOMAIN:-tradegen.example.com}
      PUBLIC_ORIGIN: https://${DOMAIN:-tradegen.example.com}
      MASTER_KEY: ${MASTER_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      APP_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  paper-evaluator:
    profiles: ["tls"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    working_dir: /app/backend
    command: ["python", "-m", "scripts.run_paper_evaluator"]
    environment:
      DATABASE_URL: postgresql+psycopg://tradegen:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/tradegen_dev
      MASTER_KEY: ${MASTER_KEY:-}
      EVALUATOR_INTERVAL_SECONDS: ${EVALUATOR_INTERVAL_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    profiles: ["tls"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx-bootstrap:
    profiles: ["tls-bootstrap"]
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./infrastructure/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/var/www/certbot:ro
  nginx:
    profiles: ["tls"]
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-tradegen.example.com}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_etc:/etc/letsencrypt:ro
      - webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
  certbot:
    profiles: ["tls"]
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap 'exit 0' TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
volumes:
  postgres-data:
  certbot_etc:
  certbot_var:
  webroot:
